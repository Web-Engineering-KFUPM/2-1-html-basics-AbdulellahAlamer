name: Lab 1 Autograder

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run autograder
        run: node grade.cjs

      # ✅ ADD THIS (does NOT change your summary step)
      - name: Build grade.json (obtained/total) for CSV collection
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f artifacts/grade.csv ]]; then
            echo "ERROR: artifacts/grade.csv not found. Make sure grade.cjs writes it."
            ls -la artifacts || true
            exit 1
          fi

          python3 - <<'PY'
          import csv, json, os, sys

          path = "artifacts/grade.csv"
          with open(path, newline="", encoding="utf-8") as f:
            reader = csv.DictReader(f)
            if reader.fieldnames is None:
              print("ERROR: grade.csv missing header row", file=sys.stderr)
              sys.exit(1)

            fields_lower = [h.strip().lower() for h in reader.fieldnames]

            def find_col(candidates):
              for c in candidates:
                if c in fields_lower:
                  return reader.fieldnames[fields_lower.index(c)]
              return None

            obtained_col = find_col(["obtained", "score", "earned", "points"])
            total_col    = find_col(["total", "possible", "max_points", "max", "out_of"])

            if not obtained_col or not total_col:
              print("ERROR: Could not find obtained/total columns in grade.csv header.", file=sys.stderr)
              print("Header:", reader.fieldnames, file=sys.stderr)
              sys.exit(2)

            obtained = 0.0
            total = 0.0

            def to_num(x):
              x = (x or "").strip()
              if x == "":
                return 0.0
              try:
                return float(x)
              except:
                return 0.0

            for row in reader:
              obtained += to_num(row.get(obtained_col, ""))
              total += to_num(row.get(total_col, ""))

            def norm(n):
              return int(n) if abs(n - int(n)) < 1e-9 else n

            out = {"obtained": norm(obtained), "total": norm(total)}
            os.makedirs("artifacts", exist_ok=True)
            with open("artifacts/grade.json", "w", encoding="utf-8") as g:
              json.dump(out, g)
            print("Wrote artifacts/grade.json:", out)
          PY

      # ✅ KEEP YOUR EXISTING "DISPLAY SUMMARY" STEP HERE AS-IS
      # (Do not change it. Just leave it where it already is in your workflow.)
      #
      # Example (yours may differ):
      # - name: Write summary
      #   run: |
      #     echo "..." >> $GITHUB_STEP_SUMMARY

      - name: Upload grading artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lab1-grading-feedback
          path: |
            artifacts/grade.csv
            artifacts/grade.json
            artifacts/feedback/README.md
